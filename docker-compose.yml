name: ${LOCAL_AUTH_COMPOSE_PROJECT:?LOCAL_AUTH_COMPOSE_PROJECT is required}

services:
  proxy:
    image: traefik:v3.7.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${LOCAL_AUTH_NETWORK:?LOCAL_AUTH_NETWORK is required}
      - --providers.docker.constraints=Label(`com.docker.compose.project`,`${LOCAL_AUTH_COMPOSE_PROJECT:?LOCAL_AUTH_COMPOSE_PROJECT is required}`)
      - --entrypoints.web.address=:80
      - --ping=true
      - --ping.entrypoint=web
      - --api.dashboard=false
      - --accesslog=false
    ports:
      - "127.0.0.1:${LOCAL_AUTH_PROXY_PORT:?LOCAL_AUTH_PROXY_PORT is required}:80"
    networks:
      - auth
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      zitadel-api:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy

  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zitadel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - auth
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d zitadel -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.29.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOCAL_AUTH_MAILPIT_UI_PORT:?LOCAL_AUTH_MAILPIT_UI_PORT is required}:8025"
    networks:
      - auth

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:v4.16.2
    restart: unless-stopped
    user: "0"
    command:
      - start-from-init
      - --steps
      - /zitadel/steps.yaml
      - --masterkey
      - ZitadelLocalMasterKey0123456789a
    environment:
      ZITADEL_PORT: "8080"
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: "${LOCAL_AUTH_PROXY_PORT:?LOCAL_AUTH_PROXY_PORT is required}"
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/zitadel?sslmode=disable
      ZITADEL_SYSTEMDEFAULTS_PASSWORDHASHER_VERIFIERS: argon2
      ZITADEL_FIRSTINSTANCE_INSTANCENAME: Ensombl local
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Ensombl
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: developer@ensombl.test
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: developer@ensombl.test
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: Ensombl-Dev-2026!
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: local-bootstrap-admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Local bootstrap administrator
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: ZITADEL Login
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: ${LOCAL_AUTH_ISSUER:?LOCAL_AUTH_ISSUER is required}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: ${LOCAL_AUTH_ISSUER:?LOCAL_AUTH_ISSUER is required}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: ${LOCAL_AUTH_ISSUER:?LOCAL_AUTH_ISSUER is required}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: mailpit:1025
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_TLS: "false"
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: noreply@notifications.ensombl.io
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: Ensombl
      ZITADEL_DEFAULTINSTANCE_DOMAINPOLICY_SMTPSENDERADDRESSMATCHESINSTANCEDOMAIN: "false"
    volumes:
      - ./deploy/zitadel/steps.yaml:/zitadel/steps.yaml:ro
      - bootstrap:/zitadel/bootstrap
    networks:
      - auth
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${LOCAL_AUTH_NETWORK:?LOCAL_AUTH_NETWORK is required}
      - traefik.http.services.${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-api.loadbalancer.server.port=8080
      - traefik.http.services.${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-api.loadbalancer.server.scheme=h2c
      - traefik.http.middlewares.${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-host.headers.customrequestheaders.Host=localhost:${LOCAL_AUTH_PROXY_PORT:?LOCAL_AUTH_PROXY_PORT is required}
      - traefik.http.middlewares.${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-host.headers.customrequestheaders.X-Forwarded-Host=localhost:${LOCAL_AUTH_PROXY_PORT:?LOCAL_AUTH_PROXY_PORT is required}
      - traefik.http.middlewares.${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-host.headers.customrequestheaders.X-Forwarded-Proto=http
      - traefik.http.routers.${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-api.rule=!PathPrefix(`/ui/v2/login`) && !Path(`/`)
      - traefik.http.routers.${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-api.entrypoints=web
      - traefik.http.routers.${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-api.middlewares=${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-host
      - traefik.http.routers.${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-api.service=${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-api
      - traefik.http.routers.${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-api.priority=100

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.16.2
    restart: unless-stopped
    user: "0"
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: X-ZITADEL-INSTANCE-HOST:localhost:${LOCAL_AUTH_PROXY_PORT:?LOCAL_AUTH_PROXY_PORT is required},Host:localhost,X-Forwarded-Proto:http
    volumes:
      - bootstrap:/zitadel/bootstrap:ro
    networks:
      - auth
    depends_on:
      zitadel-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/bin/sh",
          "-c",
          "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy",
        ]
      interval: 5s
      timeout: 10s
      retries: 40
    labels:
      - traefik.enable=true
      - traefik.docker.network=${LOCAL_AUTH_NETWORK:?LOCAL_AUTH_NETWORK is required}
      - traefik.http.services.${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-login.loadbalancer.server.port=3000
      - traefik.http.middlewares.${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-root.replacepath.path=/ui/v2/login/
      - traefik.http.routers.${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-root.rule=Path(`/`)
      - traefik.http.routers.${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-root.entrypoints=web
      - traefik.http.routers.${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-root.middlewares=${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-root
      - traefik.http.routers.${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-root.service=${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-login
      - traefik.http.routers.${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-root.priority=300
      - traefik.http.routers.${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-login.rule=PathPrefix(`/ui/v2/login`)
      - traefik.http.routers.${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-login.entrypoints=web
      - traefik.http.routers.${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-login.service=${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-login
      - traefik.http.routers.${LOCAL_RUNTIME_ID:?LOCAL_RUNTIME_ID is required}-login.priority=200

  product-bootstrap:
    profiles: ["operator"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    build:
      context: .
      dockerfile: deploy/operator/Dockerfile
    restart: "no"
    environment:
      ZITADEL_URL: http://proxy
      ZITADEL_REQUEST_HOST: localhost
      ZITADEL_FORWARDED_PROTO: http
      ZITADEL_ADMIN_PAT_FILE: /zitadel/bootstrap/admin.pat
      PRODUCT_CATALOG_PATH: /app/deploy/products/products.local.json
      LOCAL_APPLICATION_BASE_URL: ${LOCAL_APPLICATION_BASE_URL:?LOCAL_APPLICATION_BASE_URL is required}
      LOCAL_AUTH_ISSUER: ${LOCAL_AUTH_ISSUER:?LOCAL_AUTH_ISSUER is required}
      ZITADEL_RUNTIME_CONFIG_PATH: /output/runtime.json
      ZITADEL_ROTATE_MISSING_CLIENT_SECRETS: "true"
    volumes:
      - bootstrap:/zitadel/bootstrap:ro
      - ./.local:/output
    networks:
      - auth
    depends_on:
      proxy:
        condition: service_started

networks:
  auth:
    name: ${LOCAL_AUTH_NETWORK:?LOCAL_AUTH_NETWORK is required}

volumes:
  postgres-data:
  bootstrap:
