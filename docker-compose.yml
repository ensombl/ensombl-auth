name: ensombl-auth-local

services:
  proxy:
    image: traefik:v3.7.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=ensombl-auth-local
      - --providers.docker.constraints=Label(`com.docker.compose.project`,`ensombl-auth-local`)
      - --entrypoints.web.address=:80
      - --ping=true
      - --ping.entrypoint=web
      - --api.dashboard=false
      - --accesslog=false
    ports:
      - "127.0.0.1:24455:80"
    networks:
      - auth
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      zitadel-api:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy

  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zitadel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - auth
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d zitadel -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.29.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:28025:8025"
    networks:
      - auth

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:v4.16.2
    restart: unless-stopped
    user: "0"
    command:
      - start-from-init
      - --steps
      - /zitadel/steps.yaml
      - --masterkey
      - ZitadelLocalMasterKey0123456789a
    environment:
      ZITADEL_PORT: "8080"
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: "24455"
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/zitadel?sslmode=disable
      ZITADEL_SYSTEMDEFAULTS_PASSWORDHASHER_VERIFIERS: argon2
      ZITADEL_FIRSTINSTANCE_INSTANCENAME: Ensombl local
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Ensombl
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: developer@ensombl.test
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: developer@ensombl.test
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: Ensombl-Dev-2026!
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: local-bootstrap-admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Local bootstrap administrator
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: ZITADEL Login
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://localhost:24455/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://localhost:24455/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://localhost:24455/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: mailpit:1025
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_TLS: "false"
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: noreply@notifications.ensombl.io
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: Ensombl
      ZITADEL_DEFAULTINSTANCE_DOMAINPOLICY_SMTPSENDERADDRESSMATCHESINSTANCEDOMAIN: "false"
    volumes:
      - ./deploy/zitadel/steps.yaml:/zitadel/steps.yaml:ro
      - bootstrap:/zitadel/bootstrap
    networks:
      - auth
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 15s
    labels:
      traefik.enable: "true"
      traefik.docker.network: ensombl-auth-local
      traefik.http.services.ensombl-auth-local-api.loadbalancer.server.port: "8080"
      traefik.http.services.ensombl-auth-local-api.loadbalancer.server.scheme: h2c
      traefik.http.middlewares.ensombl-auth-local-host.headers.customrequestheaders.Host: localhost:24455
      traefik.http.middlewares.ensombl-auth-local-host.headers.customrequestheaders.X-Forwarded-Host: localhost:24455
      traefik.http.middlewares.ensombl-auth-local-host.headers.customrequestheaders.X-Forwarded-Proto: http
      traefik.http.routers.ensombl-auth-local-api.rule: "!PathPrefix(`/ui/v2/login`) && !Path(`/`)"
      traefik.http.routers.ensombl-auth-local-api.entrypoints: web
      traefik.http.routers.ensombl-auth-local-api.middlewares: ensombl-auth-local-host
      traefik.http.routers.ensombl-auth-local-api.service: ensombl-auth-local-api
      traefik.http.routers.ensombl-auth-local-api.priority: "100"

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.16.2
    restart: unless-stopped
    user: "0"
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: Host:localhost,X-Forwarded-Proto:http
    volumes:
      - bootstrap:/zitadel/bootstrap:ro
    networks:
      - auth
    depends_on:
      zitadel-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/bin/sh",
          "-c",
          "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy",
        ]
      interval: 5s
      timeout: 10s
      retries: 40
    labels:
      traefik.enable: "true"
      traefik.docker.network: ensombl-auth-local
      traefik.http.services.ensombl-auth-local-login.loadbalancer.server.port: "3000"
      traefik.http.middlewares.ensombl-auth-local-root.replacepath.path: /ui/v2/login/
      traefik.http.routers.ensombl-auth-local-root.rule: Path(`/`)
      traefik.http.routers.ensombl-auth-local-root.entrypoints: web
      traefik.http.routers.ensombl-auth-local-root.middlewares: ensombl-auth-local-root
      traefik.http.routers.ensombl-auth-local-root.service: ensombl-auth-local-login
      traefik.http.routers.ensombl-auth-local-root.priority: "300"
      traefik.http.routers.ensombl-auth-local-login.rule: PathPrefix(`/ui/v2/login`)
      traefik.http.routers.ensombl-auth-local-login.entrypoints: web
      traefik.http.routers.ensombl-auth-local-login.service: ensombl-auth-local-login
      traefik.http.routers.ensombl-auth-local-login.priority: "200"

  product-reconcile:
    profiles: ["operator"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    build:
      context: .
      dockerfile: deploy/operator/Dockerfile
    restart: "no"
    environment:
      ZITADEL_URL: http://proxy
      ZITADEL_REQUEST_HOST: localhost
      ZITADEL_FORWARDED_PROTO: http
      ZITADEL_ADMIN_PAT_FILE: /zitadel/bootstrap/admin.pat
      PRODUCT_CATALOG_PATH: /app/deploy/products/products.local.json
      ZITADEL_RUNTIME_CONFIG_PATH: /output/runtime.json
      ZITADEL_RUNTIME_INCLUDE_ADMIN_PAT: "true"
      ZITADEL_ROTATE_MISSING_CLIENT_SECRETS: "true"
    volumes:
      - bootstrap:/zitadel/bootstrap:ro
      - ./.local:/output
    networks:
      - auth
    depends_on:
      proxy:
        condition: service_started

networks:
  auth:
    name: ensombl-auth-local

volumes:
  postgres-data:
  bootstrap:
