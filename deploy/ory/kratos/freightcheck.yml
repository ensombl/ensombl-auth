serve:
  public:
    base_url: https://auth.freightcheck.io/

selfservice:
  default_browser_return_url: https://auth.freightcheck.io/
  flows:
    error:
      ui_url: https://auth.freightcheck.io/ui/error
    settings:
      ui_url: https://auth.freightcheck.io/ui/settings
    recovery:
      ui_url: https://auth.freightcheck.io/ui/recovery
    verification:
      ui_url: https://auth.freightcheck.io/ui/verification
    logout:
      after:
        default_browser_return_url: https://auth.freightcheck.io/
    login:
      ui_url: https://auth.freightcheck.io/ui/login
    registration:
      ui_url: https://auth.freightcheck.io/ui/invitation
