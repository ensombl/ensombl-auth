version: v26.2.0

serve:
  public:
    base_url: https://auth.ensombl.io/
    cors:
      enabled: false
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: https://auth.ensombl.io/
  allowed_return_urls:
    - https://auth.ensombl.io
    - https://freightclaims.ensombl.io

  methods:
    password:
      enabled: true
    totp:
      enabled: true
      config:
        issuer: Ensombl
    lookup_secret:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true

  flows:
    error:
      ui_url: https://auth.ensombl.io/ui/error
    settings:
      ui_url: https://auth.ensombl.io/ui/settings
      privileged_session_max_age: 15m
      required_aal: highest_available
      after:
        password:
          hooks:
            - hook: web_hook
              config:
                url: http://control-plane:3000/internal/hooks/password-changed
                method: POST
                body: file:///etc/config/kratos/password-changed.jsonnet
                response:
                  ignore: false
                auth:
                  type: api_key
                  config:
                    name: Authorization
                    value: Bearer local-only-hook-secret-32-bytes
                    in: header
    recovery:
      enabled: true
      ui_url: https://auth.ensombl.io/ui/recovery
      use: code
      after:
        hooks:
          - hook: web_hook
            config:
              url: http://control-plane:3000/internal/hooks/invitation-activated
              method: POST
              body: file:///etc/config/kratos/invitation-activated.jsonnet
              response:
                ignore: false
              auth:
                type: api_key
                config:
                  name: Authorization
                  value: Bearer local-only-hook-secret-32-bytes
                  in: header
    verification:
      enabled: true
      ui_url: https://auth.ensombl.io/ui/verification
      use: code
    logout:
      after:
        default_browser_return_url: https://auth.ensombl.io/
    login:
      ui_url: https://auth.ensombl.io/ui/login
      lifespan: 10m
    registration:
      enabled: false
      ui_url: https://auth.ensombl.io/ui/invitation

session:
  lifespan: 12h
  earliest_possible_extend: 1h
  cookie:
    same_site: Lax
    persistent: true

log:
  level: info
  format: json
  leak_sensitive_values: false

secrets:
  cookie:
    - local-only-cookie-secret-change-me
  cipher:
    - local-cipher-key-exactly-32-byte

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: argon2
  argon2:
    memory: 64MB
    iterations: 3
    parallelism: 1
    salt_length: 16
    key_length: 32

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtp://mailpit:1025/?disable_starttls=true
    from_address: no-reply@ensombl.io
    from_name: Ensombl

feature_flags:
  use_continue_with_transitions: true
