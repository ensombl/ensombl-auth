name: ensombl-auth

x-bws: &bws
  BWS_ACCESS_TOKEN: ${BWS_ACCESS_TOKEN:?Inject the ensombl-auth Bitwarden access token}
  BWS_PROJECT_ID: ${BWS_PROJECT_ID:?Set the non-secret ensombl-auth project UUID}

services:
  secret-loader:
    build:
      context: ../..
      dockerfile: deploy/secret-loader/Dockerfile
    restart: "no"
    environment:
      <<: *bws
    volumes:
      - runtime-secrets:/run/ensombl-auth
    networks:
      - secret-egress

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:v4.16.2
    restart: unless-stopped
    user: "0"
    command:
      - start-from-init
      - --config
      - /run/ensombl-auth/config.json
      - --steps
      - /run/ensombl-auth/steps.yaml
      - --masterkeyFile
      - /run/ensombl-auth/masterkey
    environment:
      ZITADEL_PORT: "8080"
      ZITADEL_EXTERNALDOMAIN: auth.ensombl.io
      ZITADEL_EXTERNALPORT: "443"
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_SYSTEMDEFAULTS_PASSWORDHASHER_VERIFIERS: argon2
      ZITADEL_FIRSTINSTANCE_INSTANCENAME: Ensombl
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Ensombl
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: patrick@ensombl.io
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: patrick@ensombl.io
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bootstrap-admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Bootstrap administrator
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: ZITADEL Login
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://auth.ensombl.io/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://auth.ensombl.io/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://auth.ensombl.io/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "true"
    volumes:
      - runtime-secrets:/run/ensombl-auth:ro
      - bootstrap:/zitadel/bootstrap
    networks:
      - dokploy-network
      - auth-internal
    depends_on:
      secret-loader:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 60
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.services.ensombl-auth-zitadel.loadbalancer.server.port: "8080"
      traefik.http.services.ensombl-auth-zitadel.loadbalancer.server.scheme: h2c
      traefik.http.middlewares.ensombl-auth-security.headers.contenttypenosniff: "true"
      traefik.http.middlewares.ensombl-auth-security.headers.referrerpolicy: no-referrer
      traefik.http.middlewares.ensombl-auth-security.headers.stsseconds: "31536000"
      traefik.http.middlewares.ensombl-auth-security.headers.stsincludesubdomains: "true"
      traefik.http.middlewares.ensombl-auth-admin.redirectregex.regex: ^https://auth\.ensombl\.io/admin/?$
      traefik.http.middlewares.ensombl-auth-admin.redirectregex.replacement: https://auth.ensombl.io/ui/console
      traefik.http.routers.ensombl-auth-api.rule: Host(`auth.ensombl.io`) && !PathPrefix(`/ui/v2/login`)
      traefik.http.routers.ensombl-auth-api.entrypoints: websecure
      traefik.http.routers.ensombl-auth-api.tls.certresolver: letsencrypt
      traefik.http.routers.ensombl-auth-api.middlewares: ensombl-auth-admin@docker,ensombl-auth-security@docker
      traefik.http.routers.ensombl-auth-api.service: ensombl-auth-zitadel
      traefik.http.routers.ensombl-auth-api.priority: "100"

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.16.2
    restart: unless-stopped
    user: "0"
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: Host:auth.ensombl.io,X-Forwarded-Proto:https
    volumes:
      - bootstrap:/zitadel/bootstrap:ro
    networks:
      - dokploy-network
      - auth-internal
    depends_on:
      zitadel-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/bin/sh",
          "-c",
          "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy",
        ]
      interval: 10s
      timeout: 30s
      retries: 40
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.services.ensombl-auth-login.loadbalancer.server.port: "3000"
      traefik.http.middlewares.ensombl-auth-root.replacepath.path: /ui/v2/login/
      traefik.http.routers.ensombl-auth-root.rule: Host(`auth.ensombl.io`) && Path(`/`)
      traefik.http.routers.ensombl-auth-root.entrypoints: websecure
      traefik.http.routers.ensombl-auth-root.tls.certresolver: letsencrypt
      traefik.http.routers.ensombl-auth-root.middlewares: ensombl-auth-root@docker,ensombl-auth-security@docker
      traefik.http.routers.ensombl-auth-root.service: ensombl-auth-login
      traefik.http.routers.ensombl-auth-root.priority: "300"
      traefik.http.routers.ensombl-auth-login.rule: Host(`auth.ensombl.io`) && PathPrefix(`/ui/v2/login`)
      traefik.http.routers.ensombl-auth-login.entrypoints: websecure
      traefik.http.routers.ensombl-auth-login.tls.certresolver: letsencrypt
      traefik.http.routers.ensombl-auth-login.middlewares: ensombl-auth-security@docker
      traefik.http.routers.ensombl-auth-login.service: ensombl-auth-login
      traefik.http.routers.ensombl-auth-login.priority: "200"
      traefik.http.routers.ensombl-auth-product-root.rule: (Host(`auth.freightclaims.com`) || Host(`auth.freightcheck.io`)) && Path(`/`)
      traefik.http.routers.ensombl-auth-product-root.entrypoints: websecure
      traefik.http.routers.ensombl-auth-product-root.tls.certresolver: letsencrypt
      traefik.http.routers.ensombl-auth-product-root.middlewares: ensombl-auth-root@docker,ensombl-auth-security@docker
      traefik.http.routers.ensombl-auth-product-root.service: ensombl-auth-login
      traefik.http.routers.ensombl-auth-product-root.priority: "300"
      traefik.http.routers.ensombl-auth-product-login.rule: (Host(`auth.freightclaims.com`) || Host(`auth.freightcheck.io`)) && PathPrefix(`/ui/v2/login`)
      traefik.http.routers.ensombl-auth-product-login.entrypoints: websecure
      traefik.http.routers.ensombl-auth-product-login.tls.certresolver: letsencrypt
      traefik.http.routers.ensombl-auth-product-login.middlewares: ensombl-auth-security@docker
      traefik.http.routers.ensombl-auth-product-login.service: ensombl-auth-login
      traefik.http.routers.ensombl-auth-product-login.priority: "200"

  product-reconcile:
    build:
      context: ../..
      dockerfile: deploy/operator/Dockerfile
    restart: "no"
    environment:
      <<: *bws
      ZITADEL_URL: http://zitadel-api:8080
      ZITADEL_REQUEST_HOST: auth.ensombl.io
      ZITADEL_FORWARDED_PROTO: https
      ZITADEL_ADMIN_PAT_FILE: /zitadel/bootstrap/admin.pat
      PRODUCT_CATALOG_PATH: /app/deploy/products/products.json
      ZITADEL_RUNTIME_CONFIG_PATH: /runtime/runtime.json
      ZITADEL_ROTATE_MISSING_CLIENT_SECRETS: "false"
    volumes:
      - bootstrap:/zitadel/bootstrap:ro
      - product-runtime:/runtime
    networks:
      - auth-internal
      - secret-egress
    depends_on:
      zitadel-api:
        condition: service_healthy

networks:
  dokploy-network:
    external: true
  auth-internal:
    internal: true
  secret-egress:

volumes:
  runtime-secrets:
  bootstrap:
  product-runtime:
