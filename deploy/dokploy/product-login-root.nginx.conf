map $http_cf_connecting_ip $login_client_address {
  default $http_cf_connecting_ip;
  "" $binary_remote_addr;
}

map $request_method $login_name_limit_key {
  default "";
  POST $login_client_address;
}

limit_req_zone $login_name_limit_key zone=login_name_actions:10m rate=10r/m;

server {
  listen 8080;
  server_name _;
  absolute_redirect off;

  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  location = / {
    return 302 /ui/v2/login;
  }

  location /assets/ {
    proxy_set_header Host auth.ensombl.io;
    proxy_set_header X-ZITADEL-Instance-Host auth.ensombl.io;
    proxy_set_header X-ZITADEL-Public-Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://zitadel-api:8080;
  }

  location ~ ^/ui/v2/login/loginname/?$ {
    limit_req zone=login_name_actions burst=5 nodelay;
    limit_req_status 429;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://zitadel-login:3000;
  }

  location /ui/v2/login/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://zitadel-login:3000;
  }

  location / {
    return 404;
  }
}
