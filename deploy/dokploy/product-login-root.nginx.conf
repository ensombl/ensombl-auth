# Keep IPv4 per address and group IPv6 clients by /64.
map $binary_remote_addr $login_name_client_key {
  "~^(?<ipv6_prefix>[\s\S]{8})[\s\S]{8}$" $ipv6_prefix;
  default $binary_remote_addr;
}

map $request_method $login_name_limit_key {
  default "";
  POST $login_name_client_key;
}

limit_req_zone $login_name_limit_key zone=login_name_actions:10m rate=10r/m;

server {
  listen 8080;
  server_name _;
  absolute_redirect off;
  resolver 127.0.0.11 valid=10s ipv6=off;

  set $zitadel_api_upstream zitadel-api:8080;
  set $zitadel_login_upstream zitadel-login:3000;

  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  location = / {
    return 302 /ui/v2/login;
  }

  location /assets/ {
    proxy_set_header Host auth.ensombl.io;
    proxy_set_header X-ZITADEL-Instance-Host auth.ensombl.io;
    proxy_set_header X-ZITADEL-Public-Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://$zitadel_api_upstream;
  }

  location ~ ^/ui/v2/login/loginname/?$ {
    limit_req zone=login_name_actions burst=5 nodelay;
    limit_req_status 429;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://$zitadel_login_upstream;
  }

  location /ui/v2/login {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://$zitadel_login_upstream;
  }

  location / {
    return 404;
  }
}
